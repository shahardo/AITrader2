# ci.yml — CI pipeline: lints and tests both the backend (ruff + pytest) and the
# frontend (eslint + tsc + vitest) on every push and pull request.

name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]" "pydantic[email]" lxml
      - name: Lint (ruff)
        run: ruff check app scripts tests
      - name: Tests (pytest)
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npx eslint src
      - name: Typecheck (tsc)
        run: npx tsc -b
      - name: Tests (vitest)
        run: npm test
